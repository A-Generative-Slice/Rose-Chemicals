name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@72.61.244.121 << 'EOF'
            cd /var/www/rose-chemicals
            git pull origin main
            npm install
            cd backend && npm install && cd ..
            npm run build
            pm2 restart all
            pm2 save
          EOF
